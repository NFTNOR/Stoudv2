<style>
  :root{
    --ink:#0b0b0c;--paper:#f1f1ef;
    --grey-1:#5c5c5e;   /* menu / body secondary — ~5.9:1 on paper (AA) */
    --grey-2:#6b6b6d;   /* small print — ~4.7:1 on paper (AA) */
    --hair:rgba(11,11,12,.16);--hair-soft:rgba(11,11,12,.06);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Lato',-apple-system,sans-serif;background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;cursor:none}
  @media (hover:none){body{cursor:auto;overflow:auto}}

  a:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}

  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(70% 60% at 50% 42%, rgba(0,0,0,.04), transparent 70%)}

  /* breathing background rings */
  .bg-rings{position:fixed;inset:0;z-index:0;pointer-events:none;display:grid;place-items:center}
  .ring{position:absolute;border:1px solid var(--hair-soft);border-radius:50%;scale:1}
  .ring.a{width:min(150vh,150vw);aspect-ratio:1;animation:breatheA 15s ease-in-out infinite}
  .ring.b{width:min(108vh,108vw);aspect-ratio:1;border-color:rgba(11,11,12,.045);
    animation:breatheB 15s ease-in-out infinite}
  @keyframes breatheA{0%,100%{scale:1;opacity:.9}50%{scale:1.05;opacity:.55}}
  @keyframes breatheB{0%,100%{scale:1.04;opacity:.5}50%{scale:1;opacity:.9}}

  .stage{position:relative;z-index:2;flex:1 0 auto;display:grid;place-items:center;
    padding:40px clamp(24px,6vw,90px)}
  .composition{display:flex;align-items:center;justify-content:center;
    gap:clamp(28px,8vw,120px);width:100%;max-width:1220px;will-change:transform}

  /* ---------- logo + seal ---------- */
  .wordmark{width:clamp(150px,46vw,700px);flex:0 0 auto}
  .wordmark svg{width:100%;height:auto;overflow:visible;display:block}
  .l{opacity:0;transform:translateY(18px);animation:rise .85s var(--ease) forwards}
  .l1{animation-delay:.12s}.l2{animation-delay:.2s}.l3{animation-delay:.28s}
  .l4{animation-delay:.36s}.l5{animation-delay:.44s}
  .seal{opacity:0;animation:sealin .7s var(--ease) .6s forwards}
  .disc{fill:var(--ink)}
  .orbit-ring{fill:none;stroke:var(--hair);stroke-width:1}
  .moon{fill:var(--ink)}
  .ripple{fill:none;stroke:var(--ink);stroke-width:1.2}
  .ring-text{font-family:'Lato';font-weight:700;font-size:6px;letter-spacing:1.6px;
    fill:var(--ink);opacity:.6;text-transform:uppercase}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes sealin{from{opacity:0}to{opacity:1}}

  /* ---------- menu ---------- */
  .panel{display:flex;flex-direction:column;gap:6px}
  .menu{list-style:none;display:flex;flex-direction:column}
  .menu li{opacity:0;transform:translateY(14px);animation:rise .7s var(--ease) forwards}
  .menu li:nth-child(1){animation-delay:.7s}.menu li:nth-child(2){animation-delay:.78s}
  .menu li:nth-child(3){animation-delay:.86s}.menu li:nth-child(4){animation-delay:.94s}
  .menu li:nth-child(5){animation-delay:1.02s}
  .menu a{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--grey-1);
    font-size:clamp(14px,1.5vw,18px);letter-spacing:.16em;text-transform:uppercase;
    padding:9px 0;transition:color .35s var(--ease),transform .35s var(--ease)}
  .menu .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:0 0 auto;
    transform:scale(0);transition:transform .35s var(--ease)}
  .menu a:hover,.menu a:focus-visible,.menu a[aria-current="page"]{color:var(--ink);transform:translateX(6px)}
  .menu a:hover .dot,.menu a:focus-visible .dot,.menu a[aria-current="page"] .dot{transform:scale(1)}

  .lang{display:flex;gap:12px;align-items:center;margin-top:26px;margin-left:24px;
    opacity:0;animation:rise .7s var(--ease) 1.1s forwards}
  .lang a{text-decoration:none;color:var(--grey-2);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;transition:color .3s}
  .lang a:hover{color:var(--ink)}
  .lang span{color:var(--hair);font-size:10px}

  /* ---------- footer bar (same on every page) ---------- */
  .foot{flex-shrink:0;position:relative;z-index:2;border-top:1px solid var(--hair);
    padding:22px clamp(24px,5vw,90px);display:grid;grid-template-columns:1fr auto 1fr;
    align-items:center;gap:16px}
  .foot-addr{justify-self:start;font-style:normal;color:var(--grey-1);font-size:12px;letter-spacing:.1em}
  .foot-clock{color:var(--grey-2);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    display:flex;align-items:center;gap:7px;margin-top:5px}
  .foot-clock .live{width:5px;height:5px;border-radius:50%;background:var(--ink);animation:blink 2.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
  .foot-mail{justify-self:center}
  .foot-mail a{color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.05em;
    border-bottom:1px solid var(--grey-2);padding-bottom:2px;transition:border-color .3s}
  .foot-mail a:hover{border-color:var(--ink)}
  .foot-legal{justify-self:end;display:flex;gap:22px}
  .foot-legal a{color:var(--grey-2);text-decoration:none;font-size:12px;letter-spacing:.08em;transition:color .3s}
  .foot-legal a:hover{color:var(--ink)}

  /* ---------- mobile ---------- */
  @media(max-width:820px){
    body{cursor:auto;overflow:auto}
    .composition{gap:clamp(22px,7vw,60px);transform:none!important}
    .menu .dot{display:none}
    .menu a{gap:0}
    .menu a:hover,.menu a:focus-visible{transform:none}
    .menu a[aria-current="page"]{font-weight:700}
    .ring.a{width:min(170vw,170vh)}
    .foot{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px;
      padding:26px 24px 34px}
    .foot-addr,.foot-mail,.foot-legal{justify-self:center}
    .foot-clock{justify-content:center}
  }
  @media(max-width:520px){
    .menu a{font-size:13px;letter-spacing:.13em;padding:8px 0}
    .lang{margin-left:0}
  }

  /* ---------- visible cursor ---------- */
  .lens{position:fixed;top:0;left:0;width:8px;height:8px;border-radius:50%;background:var(--ink);
    pointer-events:none;z-index:50;transform:translate(-50%,-50%);
    transition:width .2s var(--ease),height .2s var(--ease)}
  .lens.dot{width:14px;height:14px}
  @media (hover:none){.lens{display:none}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .l,.seal,.menu li,.lang,.legal,.info{opacity:1;transform:none}
    .ring{scale:1!important}
  }

  /* ---------- cross-document page transition ---------- */
  @view-transition{ navigation:auto }
  ::view-transition-group(root){ animation-duration:.62s; animation-timing-function:var(--ease) }
  ::view-transition-old(root){ animation:none; z-index:1 }
  ::view-transition-new(root){ z-index:2; animation:vt-reveal .62s var(--ease) forwards }
  @keyframes vt-reveal{
    from{ clip-path:circle(0 at var(--vt-x,100%) var(--vt-y,0%)) }
    to{ clip-path:circle(var(--vt-r,150%) at var(--vt-x,100%) var(--vt-y,0%)) }
  }
  @keyframes vt-fade-out{ to{ opacity:0 } }
  @keyframes vt-fade-in{ from{ opacity:0 } }
  /* reduced motion: skip the expanding circle, keep a soft cross-fade */
  @media (prefers-reduced-motion:reduce){
    ::view-transition-group(root){ animation-duration:.3s }
    ::view-transition-old(root){ animation:vt-fade-out .3s ease both }
    ::view-transition-new(root){ clip-path:none; animation:vt-fade-in .3s ease both }
  }

  /* ---------- skip to content (a11y) ---------- */
  .skip-link{position:fixed;top:-50px;left:clamp(20px,5vw,40px);z-index:200;
    background:var(--ink);color:var(--paper);padding:10px 20px;
    border-radius:0 0 8px 8px;text-decoration:none;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;transition:top .2s}
  .skip-link:focus{top:0}

</style>
</head>

<script>
  const lens=document.getElementById('lens');
  const comp=document.getElementById('comp');
  const canHover=matchMedia('(hover:hover)').matches
    && !matchMedia('(prefers-reduced-motion:reduce)').matches;
  let lx=innerWidth/2,ly=innerHeight/2,cx=lx,cy=ly;
  addEventListener('mousemove',e=>{lx=e.clientX;ly=e.clientY});
  (function loop(){
    cx+=(lx-cx)*.3;cy+=(ly-cy)*.3;
    lens.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;
    if(canHover){
      const ox=(lx/innerWidth-.5),oy=(ly/innerHeight-.5);
      comp.style.transform=`translate(${ox*-14}px,${oy*-10}px)`;
    }
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a').forEach(el=>{
    el.addEventListener('mouseenter',()=>lens.classList.add('dot'));
    el.addEventListener('mouseleave',()=>lens.classList.remove('dot'));
  });

  const clock=document.getElementById('clock');
  function tick(){
    try{
      const t=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Oslo',hour:'2-digit',minute:'2-digit'}).format(new Date());
      clock.textContent='Bergen '+t;
    }catch(e){clock.textContent='Bergen';}
  }
  tick();setInterval(tick,30000);

  /* ---------- circle page transition — always grows from the brand mark (top-right) ---------- */
  addEventListener('pagereveal',e=>{
    if(!e.viewTransition) return;
    const b=document.querySelector('.brand');
    let x=innerWidth, y=0;                 // fallback: top-right corner (e.g. home)
    if(b){const r=b.getBoundingClientRect(); x=r.right; y=r.top+r.height/2;}
    const rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    const root=document.documentElement;
    root.style.setProperty('--vt-x',x+'px');
    root.style.setProperty('--vt-y',y+'px');
    root.style.setProperty('--vt-r',rad+'px');
  });
</script>
